<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090b0e">
<meta name="referrer" content="no-referrer">
<title>WestPlay · LAN Mirror</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090b0e; }
  body { font: 14px system-ui, -apple-system, sans-serif; color: #e8ecf0; overscroll-behavior: none; }
  #viewer { position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
  #mirror { width: 100%; height: 100%; object-fit: contain; display: block; touch-action: none; -webkit-user-drag: none; }
  #status { position: absolute; left: max(12px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top));
    padding: 6px 11px; background: rgba(0,0,0,.72); border-radius: 7px; pointer-events: none; font-size: 12px; }
  #rotate { display: none; position: absolute; bottom: 8%; left: 0; right: 0; text-align: center;
    pointer-events: none; text-shadow: 0 1px 4px #000; }
  @media (orientation: portrait) { #rotate { display: block; } }
</style>
</head>
<body>
<div id="viewer"><img id="mirror" alt="WestPlay live cabin screen" draggable="false"></div>
<div id="status" role="status" aria-live="polite">正在连接…</div>
<div id="rotate">横置手机可获得更大的操作区域</div>
<script>
'use strict';
const SOURCE_WIDTH = __SOURCE_WIDTH__;
const SOURCE_HEIGHT = __SOURCE_HEIGHT__;
const VIDEO_WIDTH = 1280;
const VIDEO_HEIGHT = 720;
const token = new URLSearchParams(location.search).get('token') || '';
const viewer = document.getElementById('viewer');
const mirror = document.getElementById('mirror');
const status = document.getElementById('status');
let socket = null;
let activePointer = null;
let lastMove = 0;

function contentRect() {
  const box = viewer.getBoundingClientRect();
  const imageScale = Math.min(box.width / VIDEO_WIDTH, box.height / VIDEO_HEIGHT);
  const videoLeft = box.left + (box.width - VIDEO_WIDTH * imageScale) / 2;
  const videoTop = box.top + (box.height - VIDEO_HEIGHT * imageScale) / 2;
  const sourceScale = Math.min(VIDEO_WIDTH / SOURCE_WIDTH, VIDEO_HEIGHT / SOURCE_HEIGHT);
  const pixelWidth = SOURCE_WIDTH * sourceScale;
  const pixelHeight = SOURCE_HEIGHT * sourceScale;
  return {
    left: videoLeft + (VIDEO_WIDTH - pixelWidth) * imageScale / 2,
    top: videoTop + (VIDEO_HEIGHT - pixelHeight) * imageScale / 2,
    width: pixelWidth * imageScale,
    height: pixelHeight * imageScale
  };
}
function coordinates(event) {
  const rect = contentRect();
  const x = (event.clientX - rect.left) / rect.width;
  const y = (event.clientY - rect.top) / rect.height;
  if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
  return {x, y};
}
function send(type, point = {x: 0, y: 0}) {
  if (socket?.readyState !== WebSocket.OPEN) return;
  socket.send(JSON.stringify({type, ...point}));
}
function start(event) {
  if (activePointer !== null || event.button !== 0) return;
  const point = coordinates(event);
  if (!point || point.x < 0 || point.x > 1 || point.y < 0 || point.y > 1) return;
  activePointer = event.pointerId;
  lastMove = 0;
  viewer.setPointerCapture(event.pointerId);
  send('down', point);
  event.preventDefault();
}
function move(event) {
  if (activePointer !== event.pointerId) return;
  const time = performance.now();
  if (time - lastMove < 16) return;
  lastMove = time;
  const point = coordinates(event);
  if (point) send('move', {x: Math.max(0, Math.min(1, point.x)), y: Math.max(0, Math.min(1, point.y))});
  event.preventDefault();
}
function end(event, cancel = false) {
  if (activePointer !== event.pointerId) return;
  const point = coordinates(event);
  activePointer = null;
  if (viewer.hasPointerCapture(event.pointerId)) viewer.releasePointerCapture(event.pointerId);
  send(cancel ? 'cancel' : 'up', point ? {
    x: Math.max(0, Math.min(1, point.x)), y: Math.max(0, Math.min(1, point.y))
  } : {x: 0, y: 0});
  event.preventDefault();
}
viewer.addEventListener('pointerdown', start);
viewer.addEventListener('pointermove', move);
viewer.addEventListener('pointerup', event => end(event));
viewer.addEventListener('pointercancel', event => end(event, true));
viewer.addEventListener('lostpointercapture', event => end(event, true));
viewer.addEventListener('contextmenu', event => event.preventDefault());
window.addEventListener('blur', () => {
  if (activePointer !== null) { activePointer = null; send('cancel'); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && activePointer !== null) { activePointer = null; send('cancel'); }
});

if (!token) {
  status.textContent = '缺少配对令牌，请从 Companion 复制完整配对链接';
} else {
  mirror.src = '/stream?token=' + encodeURIComponent(token);
  socket = new WebSocket('ws://' + location.host + '/ws?token=' + encodeURIComponent(token));
  socket.onopen = () => { status.textContent = '已连接 · WestPlay 镜像'; setTimeout(() => { if (socket.readyState === WebSocket.OPEN) status.hidden = true; }, 1800); };
  socket.onclose = () => { activePointer = null; status.hidden = false; status.textContent = '触控连接已断开，请刷新页面'; };
  socket.onerror = () => { status.hidden = false; status.textContent = '连接失败：检查电脑防火墙与配对地址'; };
  // The server releases held buttons if these heartbeats stop for 3 seconds.
  setInterval(() => { if (socket.readyState === WebSocket.OPEN) send('ping'); }, 1000);
}
</script>
</body>
</html>
